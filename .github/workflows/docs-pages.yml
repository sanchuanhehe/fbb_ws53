name: Documentation

on:
  # This is a required check candidate, so every PR must create it. Do not add
  # path filters: a skipped required workflow remains Pending on GitHub.
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - master
  schedule:
    # Daily at 02:37 in the repository team's operating timezone. The
    # non-zero minute avoids GitHub's busiest scheduling boundary.
    - cron: "37 2 * * *"
      timezone: Asia/Singapore
  workflow_dispatch:
    inputs:
      profile:
        description: Validation profile
        required: true
        default: full
        type: choice
        options:
          - quick
          - full
          - deploy

permissions:
  contents: read

env:
  DOCUMENTATION_OWNER: "@sanchuanhehe"
  NIGHTLY_MAX_STALE_HOURS: "24"

concurrency:
  group: docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  documentation:
    name: Documentation / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reject deploy from a non-default branch
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.profile == 'deploy' &&
          github.ref != 'refs/heads/master'
        run: |
          echo "::error title=Invalid deployment ref::The deploy profile is allowed only on master."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement .github/requirements-docs.txt

      - name: Check all documentation sources
        id: source_static
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/documentation
          python .github/scripts/check-docs.py \
            --json-report artifacts/documentation/source-static.json \
            --tsv-report artifacts/documentation/source-static.tsv \
            --annotation-limit-per-rule 2 \
            2>&1 | tee artifacts/documentation/source-static.log

      - name: Check Get Started source and executable contract
        id: get_started_contract
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.docs.get_started check-source \
            2>&1 | tee artifacts/documentation/get-started.log
          python -m tools.docs.get_started check-document docs/zh-CN/get-started/cli.md \
            2>&1 | tee artifacts/documentation/generated-contract.log

      - name: Run documentation gate unit tests
        id: documentation_tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python ci/test_ci_gate.py 2>&1 | tee artifacts/documentation/ci-gate-unit.log
          python ci/test_docs_static_checkers.py \
            2>&1 | tee artifacts/documentation/docs-checker-unit.log
          python -m unittest discover -s tests/docs -p 'test_*.py' \
            2>&1 | tee artifacts/documentation/get-started-unit.log

      - name: Build documentation strictly
        id: mkdocs_build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python -m mkdocs build --clean --strict --site-dir site \
            2>&1 | tee artifacts/documentation/mkdocs-build.log

      - name: Check rendered links, anchors, and assets
        id: rendered_site
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/check-rendered-site.py site \
            --json-report artifacts/documentation/rendered-site.json \
            --tsv-report artifacts/documentation/rendered-site.tsv \
            --annotation-limit-per-rule 2 \
            2>&1 | tee artifacts/documentation/rendered-site.log

      - name: Summarize findings and validation boundary
        id: documentation_summary
        if: always()
        shell: bash
        run: |
          set +e
          python .github/scripts/summarize-docs-reports.py \
            artifacts/documentation/source-static.json \
            artifacts/documentation/rendered-site.json \
            --output artifacts/documentation/summary.md
          summary_status=$?

          if [[ -s artifacts/documentation/summary.md ]]; then
            cat artifacts/documentation/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Documentation quality gate" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "> **REPORT ERROR:** summary.md was not generated." >> "$GITHUB_STEP_SUMMARY"
            summary_status=1
          fi

          {
            echo
            echo "### Validation boundary"
            echo
            echo "- Owner: ${DOCUMENTATION_OWNER}"
            echo "- Nightly maximum stale-success policy: ${NIGHTLY_MAX_STALE_HOURS} hours"
            echo "- This job covers source/static checks and the rendered documentation site."
            echo "- Firmware flash, serial output, Smoke, and board HIL: **NOT RUN**."
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$summary_status"

      - name: Upload documentation evidence
        id: documentation_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/documentation
          retention-days: 14
          if-no-files-found: warn

      - name: Upload GitHub Pages artifact
        if: >-
          steps.source_static.outcome == 'success' &&
          steps.rendered_site.outcome == 'success' &&
          steps.documentation_summary.outcome == 'success' &&
          (
            github.event_name == 'push' ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.profile == 'deploy' &&
              github.ref == 'refs/heads/master'
            )
          )
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1

      - name: Enforce documentation quality gate
        if: always()
        env:
          SOURCE_STATIC_RESULT: ${{ steps.source_static.outcome }}
          GET_STARTED_CONTRACT_RESULT: ${{ steps.get_started_contract.outcome }}
          DOCUMENTATION_TESTS_RESULT: ${{ steps.documentation_tests.outcome }}
          MKDOCS_BUILD_RESULT: ${{ steps.mkdocs_build.outcome }}
          RENDERED_SITE_RESULT: ${{ steps.rendered_site.outcome }}
          DOCUMENTATION_SUMMARY_RESULT: ${{ steps.documentation_summary.outcome }}
          DOCUMENTATION_EVIDENCE_RESULT: ${{ steps.documentation_evidence.outcome }}
        shell: bash
        run: |
          failed=0

          if [[ "$SOURCE_STATIC_RESULT" != "success" ]]; then
            echo "::error title=Source documentation findings::Source checker result: ${SOURCE_STATIC_RESULT}. See source-static.json/tsv in the evidence artifact."
            failed=1
          fi
          if [[ "$GET_STARTED_CONTRACT_RESULT" != "success" ]]; then
            echo "::error title=Get Started contract failure::Get Started source/contract result: ${GET_STARTED_CONTRACT_RESULT}."
            failed=1
          fi
          if [[ "$DOCUMENTATION_TESTS_RESULT" != "success" ]]; then
            echo "::error title=Documentation test failure::Documentation test result: ${DOCUMENTATION_TESTS_RESULT}."
            failed=1
          fi
          if [[ "$MKDOCS_BUILD_RESULT" != "success" ]]; then
            echo "::error title=Strict documentation build failure::MkDocs build result: ${MKDOCS_BUILD_RESULT}."
            failed=1
          fi
          if [[ "$RENDERED_SITE_RESULT" != "success" ]]; then
            echo "::error title=Rendered documentation findings::Rendered checker result: ${RENDERED_SITE_RESULT}. See rendered-site.json/tsv in the evidence artifact."
            failed=1
          fi
          if [[ "$DOCUMENTATION_SUMMARY_RESULT" != "success" ]]; then
            echo "::error title=Documentation report unavailable::Summary result: ${DOCUMENTATION_SUMMARY_RESULT}."
            failed=1
          fi
          if [[ "$DOCUMENTATION_EVIDENCE_RESULT" != "success" ]]; then
            echo "::error title=Documentation evidence upload failure::Evidence upload result: ${DOCUMENTATION_EVIDENCE_RESULT}."
            failed=1
          fi

          for report in \
            artifacts/documentation/source-static.json \
            artifacts/documentation/source-static.tsv \
            artifacts/documentation/rendered-site.json \
            artifacts/documentation/rendered-site.tsv; do
            if [[ ! -s "$report" ]]; then
              echo "::error title=Documentation report unavailable::Missing or empty ${report}."
              failed=1
            fi
          done

          if (( failed != 0 )); then
            echo "Documentation quality gate: FAIL"
            exit 1
          fi
          echo "Documentation quality gate: PASS"

  upstream_links:
    name: Documentation / upstream links
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.profile != 'quick'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check declared upstream references
        run: >-
          python .github/scripts/check-upstream-links.py
          --output upstream-links.json
          --min-refs 16
          --retries 3
          --timeout 20

      - name: Upload upstream-link evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-link-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: upstream-links.json
          retention-days: 14
          if-no-files-found: warn

  get_started_build:
    name: Get Started / ${{ matrix.label }} non-HIL build
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.profile == 'full'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            platform: linux
            runner: ubuntu-24.04
          - label: Windows
            platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Enable long Git paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out repository and Git LFS objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned FBB CLI
        run: python -m tools.docs.get_started install-cli

      - name: Run the exact non-HIL Get Started path
        env:
          FBB_INSTALL_DIR: ${{ runner.temp }}/hs-fbb
          FBB_NO_COLOR: "1"
          NO_COLOR: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: >-
          python -m tools.docs.get_started run
          --platform ${{ matrix.platform }}
          --runner-label ${{ matrix.runner }}
          --evidence-dir artifacts/get-started-${{ matrix.platform }}

      - name: Validate non-HIL build evidence
        if: always()
        run: >-
          python -m tools.docs.get_started validate-evidence
          --summary artifacts/get-started-${{ matrix.platform }}/summary.json
          --platform ${{ matrix.platform }}
          --runner-label ${{ matrix.runner }}
          --sdk-commit ${{ github.sha }}

      - name: Upload non-HIL build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: get-started-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/get-started-${{ matrix.platform }}
          retention-days: 14
          if-no-files-found: error

  nightly_result:
    name: Documentation / nightly result
    if: >-
      always() &&
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.profile == 'full'
        )
      )
    needs:
      - documentation
      - upstream_links
      - get_started_build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce complete nightly evidence
        env:
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          UPSTREAM_LINKS_RESULT: ${{ needs.upstream_links.result }}
          GET_STARTED_BUILD_RESULT: ${{ needs.get_started_build.result }}
        shell: bash
        run: |
          {
            echo "## Nightly documentation result"
            echo
            echo "| Layer | Result |"
            echo "| --- | --- |"
            echo "| Full-site static and rendered checks | ${DOCUMENTATION_RESULT} |"
            echo "| Declared upstream links | ${UPSTREAM_LINKS_RESULT} |"
            echo "| Get Started Windows/Linux Build | ${GET_STARTED_BUILD_RESULT} |"
            echo "| Flash / serial / Smoke / HIL | NOT RUN |"
            echo
            echo "Owner: ${DOCUMENTATION_OWNER}; maximum stale success: ${NIGHTLY_MAX_STALE_HOURS} hours."
          } >> "$GITHUB_STEP_SUMMARY"

          test "$DOCUMENTATION_RESULT" = success
          test "$UPSTREAM_LINKS_RESULT" = success
          test "$GET_STARTED_BUILD_RESULT" = success

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      always() &&
      needs.documentation.result == 'success' &&
      (
        needs.upstream_links.result == 'success' ||
        needs.upstream_links.result == 'skipped'
      ) &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.profile == 'deploy' &&
          github.ref == 'refs/heads/master'
        )
      )
    needs:
      - documentation
      - upstream_links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
